# 馬柱ラボの週次自動更新（PCを使わずGitHubのクラウドで動かす）
# 時刻はUTCで指定（日本時間 = UTC+9）。GitHubの定期実行は数分〜十数分遅れることがあります。
name: weekly

on:
  schedule:
    - cron: '0 9 * * 4'       # 木 18:00 JST  plan（今週の重賞を探して予想）
    - cron: '0 11 * * 5,6,0'  # 金土日 20:00 JST  update（30時間以内のレース）
    - cron: '30 4 * * 6,0,1'  # 土日月 13:30 JST  update（4時間以内のレース）
    - cron: '0 9 * * 1'       # 月 18:00 JST  record（結果を記録）
  workflow_dispatch:          # スマホのGitHubアプリから手動で実行できる
    inputs:
      mode:
        description: 'plan=今週の重賞を探す / update=予想を更新 / record=結果を記録'
        type: choice
        options: [update, plan, record]
        default: update

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Japan time

        run: tzutil /s "Tokyo Standard Time"

      - name: 実行
        shell: powershell
        env:
          SCHED: ${{ github.event.schedule }}
          MODE_IN: ${{ inputs.mode }}
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $mode = 'update'; $within = 0
          switch ($env:SCHED) {
            '0 9 * * 4'      { $mode = 'plan' }
            '0 11 * * 5,6,0' { $mode = 'update'; $within = 30 }
            '30 4 * * 6,0,1' { $mode = 'update'; $within = 4 }
            '0 9 * * 1'      { $mode = 'record' }
            default          { if ($env:MODE_IN) { $mode = $env:MODE_IN } }
          }
          "mode=$mode within=$within  $(Get-Date -Format 'yyyy-MM-dd HH:mm') JST"
          $out = & .\tools\weekly.ps1 -Mode $mode -WithinHours $within
          $out
          "## $mode  $(Get-Date -Format 'MM/dd HH:mm') JST" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $out | % { "- $_" } | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: 結果を保存
        shell: powershell
        run: |
          git config user.name "umabashira-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "auto update $(Get-Date -Format 'yyyy-MM-dd HH:mm') JST"
            git pull --rebase
            git push
          } else { "no changes" }
